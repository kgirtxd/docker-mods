services:
  prowlarr:
    build:
      context: .
      dockerfile: Dockerfile.test-prowlarr
    image: prowlarr-sync-download-clients:test
    container_name: prowlarr-sync-download-clients-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
      PROWLARR_SYNC_INTERVAL: "30"
      PROWLARR_SYNC_LOG_LEVEL: "debug"
    ports:
      - "39696:9696"
    tmpfs:
      - /config
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9696/ping || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission-sync-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    ports:
      - "39091:9091"
    tmpfs:
      - /config
      - /downloads

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr-sync-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    ports:
      - "38989:8989"
    tmpfs:
      - /config
      - /tv
      - /downloads

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr-sync-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    ports:
      - "37878:7878"
    tmpfs:
      - /config
      - /movies
      - /downloads

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr-sync-test
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
    ports:
      - "38686:8686"
    tmpfs:
      - /config
      - /music
      - /downloads
